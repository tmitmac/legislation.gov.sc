<script>

    const params = new URLSearchParams(window.location.search);
const query = (params.get("q") || "").trim().toLowerCase();
const status = params.get("status") || "inforce";
const searchType = params.get("search") || "title";

customElements.whenDefined("custom-navbar").then(() => {
    const navbar = document.querySelector("custom-navbar");

    const shadow = navbar.shadowRoot;

    shadow.getElementById("statusFilter").value = status;
    shadow.getElementById("searchType").value = searchType;
});

async function performSearch() {

    let results = [];

    for (const act of acts) {

        // Status filter
        if (status === "inforce" && !(act.inForce === true && !act.bill)) {
            continue;
        }

        if (status === "repealed" && !(act.inForce === false && !act.bill)) {
            continue;
        }

        if (status === "bill" && !act.bill) {
            continue;
        }


        let matches = false;


        // Title search
        if (searchType === "title") {

            matches = act.name
                .toLowerCase()
                .includes(query);

        }


        // Content search
        if (searchType === "content") {

            try {

                const response = await fetch(
                    act.file.replace("viewer.html?act=", "")
                );

                const text = await response.text();

                matches = text
                    .toLowerCase()
                    .includes(query);

            } catch(error) {

                console.error(
                    "Could not search:",
                    act.file
                );

            }

        }


        if (matches) {
            results.push(act);
        }

    }


    document.getElementById("resultsHeading").textContent =
    `Your search for '${query}' has returned ${results.length} result${results.length !== 1 ? "s" : ""}`;


    renderResults(results);

}


performSearch();

document.getElementById("resultsHeading").textContent =
`Your title search for '${query}' has returned ${filtered.length} result${filtered.length !== 1 ? "s" : ""}`;

renderResults(filtered);


document.getElementById("sortSelect").addEventListener("change", () => {

    const value = document.getElementById("sortSelect").value;

    if(value === "az"){
        filtered.sort((a,b)=>a.name.localeCompare(b.name));
    }

    renderResults(filtered);

});


function renderResults(list){

    const container = document.getElementById("resultsContainer");

    container.innerHTML = "";

    if(list.length === 0){

        container.innerHTML = `
        <div class="card">
            No legislation matched your search.
        </div>`;

        return;
    }


    list.forEach(act => {

    let badges = "";

    // Type badge
    if (act.type) {
        badges += `<span class="badge">${
            act.type.charAt(0).toUpperCase() + act.type.slice(1)
        }</span>`;
    }

    // Status badge
    if (act.inForce === true) {
        badges += `<span class="badge-green">In force</span>`;
    } else if (act.inForce === false) {
        badges += `<span class="badge-red">Repealed</span>`;
    }

    // Latest version badge (Acts only)
    if (act.type === "act" && !act.bill) {
        badges += `<span class="badge-green">Latest version</span>`;
    }

container.innerHTML += `
    <div class="card">

        <div class="header-row">
            ${badges}

            <span class="header-meta">
                (as enacted)
                ${act.number ? ` | ${act.number}` : ""}
                ${act.agency ? ` | Administered by ${act.agency}` : ""}
            </span>
        </div>

        <a class="title" href="${act.file}">
            ${act.name}
        </a>

    </div>
`;

});

}
